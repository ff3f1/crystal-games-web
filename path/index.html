<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2f8fe6">
<title>Нарисуй путь</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2f8fe6;touch-action:none;color:#fff;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:"Trebuchet MS","Segoe UI",Roboto,Arial,sans-serif}
  button{font-family:inherit}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  .scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;z-index:4;overflow-y:auto;
    padding:calc(16px + env(safe-area-inset-top)) 16px 24px;box-sizing:border-box}
  .scr.on{display:flex;animation:fi .3s ease}
  @keyframes fi{from{opacity:0}}
  /* меню */
  #scrMenu{justify-content:space-between;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
  .logo{margin-top:5vh;text-align:center;transform:rotate(-4deg)}
  .logo b{display:block;font-size:min(14vw,66px);font-weight:900;line-height:.95;color:#fff;letter-spacing:1px;
    text-shadow:0 5px 0 #2b4c9b,0 10px 0 rgba(0,0,0,.15)}
  .logo b:nth-child(2){color:#ffd84d;text-shadow:0 5px 0 #d1691c,0 10px 0 rgba(0,0,0,.15);margin-left:12vw}
  .mbtns{width:min(100%,360px);display:flex;flex-direction:column;gap:12px}
  .big{border:0;border-radius:22px;padding:18px;font-size:24px;font-weight:900;color:#fff;cursor:pointer;
    background:linear-gradient(#5ee88f,#22b35b);box-shadow:0 7px 0 #158043,0 12px 20px rgba(0,0,0,.18);letter-spacing:.5px}
  .big:active{transform:translateY(5px);box-shadow:0 2px 0 #158043}
  .big small{display:block;font-size:14px;font-weight:700;opacity:.9;letter-spacing:0}
  .row{display:flex;gap:12px}
  .mid{flex:1;border:0;border-radius:18px;padding:14px 8px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;
    background:rgba(20,40,90,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(3px)}
  .mid:active{transform:translateY(2px)}
  /* карта уровней и скины */
  .bar{width:min(100%,460px);display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .bar h2{flex:1;margin:0;text-align:center;font-size:24px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
  .back{width:46px;height:46px;border-radius:15px;border:0;background:rgba(20,40,90,.35);color:#fff;font-size:26px;font-weight:900;cursor:pointer}
  .stc{min-width:56px;text-align:right;font-weight:900;color:#ffd84d;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .chap{width:min(100%,460px);border-radius:22px;padding:12px 12px 14px;margin-top:12px;box-sizing:border-box}
  .chap h3{margin:0 0 10px;font-size:17px;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
  .lv{aspect-ratio:1;border:0;border-radius:16px;color:#3a2a00;font-weight:900;font-size:21px;cursor:pointer;position:relative;
    background:linear-gradient(#fff6c9,#ffd84d);box-shadow:0 4px 0 #c58a12;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .lv:active{transform:translateY(3px);box-shadow:0 1px 0 #c58a12}
  .lv i{font-style:normal;font-size:11px;letter-spacing:1px;color:#d1691c}
  .lv.cur{background:linear-gradient(#7dffb0,#2fd174);box-shadow:0 4px 0 #17803f;color:#fff;animation:pl .9s infinite alternate}
  .lv.cur i{color:#fff}
  .lv.lock{background:rgba(255,255,255,.22);box-shadow:none;color:rgba(255,255,255,.7);cursor:default;font-size:18px}
  @keyframes pl{to{transform:scale(1.07)}}
  .skins{width:min(100%,460px);display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .sk{background:rgba(20,40,90,.3);border-radius:20px;padding:12px;text-align:center;cursor:pointer;border:3px solid transparent;font-weight:800}
  .sk.sel{border-color:#ffd84d;background:rgba(20,40,90,.45)}
  .sk canvas{width:84px;height:84px;display:block;margin:0 auto 6px}
  .sk small{display:block;font-size:12px;opacity:.9;margin-top:3px}
  /* игровой интерфейс */
  #hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;display:none;align-items:center;gap:10px;z-index:3}
  #hud.on{display:flex}
  #hud .back{flex:none}
  #hudMid{flex:1;background:rgba(20,40,90,.35);border-radius:16px;padding:6px 12px;backdrop-filter:blur(3px)}
  #hudTop{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:15px}
  #hStars span{font-size:18px;color:rgba(255,255,255,.35);margin-left:2px;transition:.2s}
  #hStars span.on{color:#ffd84d;text-shadow:0 0 10px rgba(255,216,77,.9)}
  #ink{height:9px;background:rgba(0,0,0,.25);border-radius:5px;margin-top:5px;overflow:hidden}
  #ink i{display:block;height:100%;width:100%;border-radius:5px;background:linear-gradient(90deg,#ff6b9d,#ffb84d,#ffe94d,#5ee88f,#4dc3ff,#9d7dff)}
  #tools{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));display:none;gap:10px;justify-content:center;align-items:flex-end;z-index:3}
  #tools.on{display:flex}
  .tb{width:58px;height:58px;border-radius:18px;border:0;background:rgba(20,40,90,.4);color:#fff;font-size:24px;cursor:pointer;position:relative;
    backdrop-filter:blur(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
  .tb:active{transform:translateY(2px)}
  .tb .ad{position:absolute;top:-6px;right:-6px;background:#ffb020;border-radius:9px;font-size:10px;padding:2px 5px;font-weight:900}
  #bPlay{width:auto;min-width:130px;padding:0 20px;font-size:21px;font-weight:900;background:linear-gradient(#5ee88f,#22b35b);box-shadow:0 5px 0 #158043}
  #bPlay.stop{background:linear-gradient(#ff9a6b,#f2553c);box-shadow:0 5px 0 #b33a22}
  #bPlay:active{box-shadow:0 1px 0 #158043}
  /* окна */
  .ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(15,30,70,.55);backdrop-filter:blur(4px);z-index:8}
  .ov.on{display:flex;animation:fi .25s}
  .card{width:min(86vw,350px);background:#fff;color:#2b3550;border-radius:28px;padding:22px 20px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{from{transform:scale(.6) rotate(-4deg)}}
  .card h2{margin:0 0 6px;font-size:28px;color:#2b4c9b}
  .card p{margin:6px 0;color:#58627c;line-height:1.4}
  .bst{font-size:50px;letter-spacing:6px;margin:4px 0}
  .bst span{display:inline-block;color:#dfe5f0;transform:scale(0)}
  .bst span.on{color:#ffc61a;text-shadow:0 4px 0 #d18a00}
  .bst span.show{animation:st .45s cubic-bezier(.2,1.6,.4,1) forwards}
  @keyframes st{from{transform:scale(0) rotate(-120deg)}to{transform:scale(1)}}
  .btn{display:block;width:100%;margin-top:11px;padding:15px;border:0;border-radius:18px;font-size:18px;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .g{background:linear-gradient(#5ee88f,#22b35b)} .y{background:linear-gradient(#ffcf4a,#f29a18)} .b{background:linear-gradient(#6fb6ff,#3d7cf2)}
  .gr{background:#e8edf6;color:#4a5677;box-shadow:0 5px 0 #c9d2e3}
  .tg{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-size:18px;border-bottom:1px solid #eef1f7;cursor:pointer;font-weight:700}
  .sw{width:54px;height:30px;border-radius:15px;background:#cfd6e4;position:relative;transition:.2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .sw.on{background:#22b35b} .sw.on::after{left:27px}
  #toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:rgba(20,30,60,.85);color:#fff;padding:10px 18px;border-radius:14px;
    font-size:15px;font-weight:700;opacity:0;transition:.3s;z-index:20;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="scr on" id="scrMenu">
  <div class="logo"><b>НАРИСУЙ</b><b>ПУТЬ</b></div>
  <div class="mbtns">
    <button class="big" id="bGo">▶ Играть<small id="goSub">Уровень 1</small></button>
    <div class="row"><button class="mid" id="bLevels">🗺️ Уровни</button><button class="mid" id="bSkins">⚪ Шарики</button></div>
    <div class="row"><button class="mid" id="bSet">⚙️ Настройки</button></div>
  </div>
</div>

<div class="scr" id="scrLevels">
  <div class="bar"><button class="back" data-back>‹</button><h2>Уровни</h2><div class="stc" id="lvStars">★ 0</div></div>
  <div id="chaps" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
</div>

<div class="scr" id="scrSkins">
  <div class="bar"><button class="back" data-back>‹</button><h2>Шарики</h2><div class="stc" id="skStars">★ 0</div></div>
  <div class="skins" id="skGrid"></div>
</div>

<div id="hud">
  <button class="back" id="bBack">‹</button>
  <div id="hudMid"><div id="hudTop"><span id="hLv">Уровень 1</span><span id="hStars"><span>★</span><span>★</span><span>★</span></span></div><div id="ink"><i id="inkBar"></i></div></div>
</div>
<div id="tools">
  <button class="tb" id="bUndo" aria-label="Отменить">↶</button>
  <button class="tb" id="bClear" aria-label="Стереть всё">🗑</button>
  <button class="tb" id="bPlay">▶ Пуск</button>
  <button class="tb" id="bHint" aria-label="Подсказка">💡<span class="ad" id="hintAd">▶</span></button>
  <button class="tb" id="bSkip" aria-label="Пропустить">⏭<span class="ad">▶</span></button>
</div>

<div class="ov" id="ovEnd"><div class="card" id="endCard"></div></div>
<div class="ov" id="ovSet"><div class="card">
  <h2>Настройки</h2>
  <div class="tg" data-k="sound">Звуки <div class="sw"></div></div>
  <div class="tg" data-k="music">Музыка <div class="sw"></div></div>
  <div class="tg" data-k="vibro">Вибрация <div class="sw"></div></div>
  <button class="btn g" id="bSetOk">Готово</button>
</div></div>
<div class="ov" id="ovAd"><div class="card"><h2>Реклама</h2><p>Тестовый показ…</p></div></div>
<div id="toast"></div>

<script>
"use strict";
/* ================= Хранилище ================= */
const Store={
  get(k,d){try{const v=localStorage.getItem("dp_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("dp_"+k,JSON.stringify(v))}catch(e){}}
};
const settings=Object.assign({sound:true,music:true,vibro:true},Store.get("settings",{}));
const $=id=>document.getElementById(id);

/* ================= Реклама ================= */
const Ads=(function(){
  const platform= window.AndroidAds ? "android" : (/vk_app_id=/.test(location.search) ? "vk" : "web");
  let bridge=null,lastInter=Date.now(),busy=false;const pending={};let seq=0;
  window.__adResult=function(id,ok){if(pending[id]){pending[id](!!ok);delete pending[id];}};
  async function show(kind){
    if(busy)return false;busy=true;Sound.suspend();let ok=false;
    try{
      if(platform==="vk"&&bridge){const r=await bridge.send("VKWebAppShowNativeAds",{ad_format:kind==="reward"?"reward":"interstitial"});ok=!!(r&&r.result);}
      else if(platform==="android"){ok=await new Promise(res=>{const id=++seq;pending[id]=res;
        kind==="reward"?window.AndroidAds.showRewarded(id):window.AndroidAds.showInterstitial(id);
        setTimeout(()=>{if(pending[id]){pending[id](false);delete pending[id]}},60e3);});}
      else{const o=$("ovAd");o.classList.add("on");await new Promise(r=>setTimeout(r,1100));o.classList.remove("on");ok=true;}
    }catch(e){ok=false}
    busy=false;Sound.resume();return ok;
  }
  return{platform,
    init(){if(platform!=="vk")return;const s=document.createElement("script");s.src="vk-bridge.min.js";s.onerror=()=>{const c=document.createElement("script");c.src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js";c.onload=s.onload;document.head.appendChild(c);};
      s.onload=()=>{bridge=window.vkBridge;try{bridge.send("VKWebAppInit")}catch(e){}};document.head.appendChild(s);},
    rewarded(){return show("reward")},
    async interstitial(){if(Date.now()-lastInter<90e3)return false;const ok=await show("inter");if(ok)lastInter=Date.now();return ok;}
  };
})();

/* ================= Звук ================= */
const Sound=(function(){
  let ac=null,master,musicGain,timer,step=0,nbuf;
  const N=n=>440*Math.pow(2,(n-69)/12);
  function tone(f,t0,dur,type,vol,dest,slide){const o=ac.createOscillator(),g=ac.createGain();o.type=type||"sine";
    o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(dest||master);o.start(t0);o.stop(t0+dur+.05);}
  function noise(t0,dur,vol,type,freq,q){const s=ac.createBufferSource();s.buffer=nbuf;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;if(q)f.Q.value=q;
    const g=ac.createGain();g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random()*.5);s.stop(t0+dur);}
  const SC=[60,62,64,67,69,72,74,76];
  function music(){if(timer)return;let next=ac.currentTime+.1;const bt=.32;
    const chords=[[48,55,64],[45,52,60],[41,48,57],[43,50,59]];
    timer=setInterval(()=>{if(ac.state!=="running")return;
      while(next<ac.currentTime+1.2){const ch=chords[Math.floor(step/16)%4],i=step%16;
        if(i===0)ch.forEach(n=>tone(N(n),next,bt*15,"sine",.035,musicGain));
        if(i%4===0)tone(N(ch[0]-12),next,bt*3,"triangle",.07,musicGain);
        if([0,3,6,8,10,13].includes(i)&&Math.random()<.85)tone(N(SC[(step*5+i*3)%SC.length]+12),next,bt*1.4,"triangle",.035,musicGain);
        step++;next+=bt;}},250);}
  function vib(ms){if(settings.vibro&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
  let lastDraw=0,lastBump=0;const ok=()=>ac&&settings.sound;
  return{
    unlock(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return}
      master=ac.createGain();master.gain.value=.55;master.connect(ac.destination);
      musicGain=ac.createGain();musicGain.gain.value=settings.music?.22:0;musicGain.connect(master);
      nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;music();}
      if(ac.state==="suspended"&&!document.hidden)ac.resume();},
    suspend(){if(ac)ac.suspend()},resume(){if(ac&&!document.hidden)ac.resume()},
    setMusic(on){if(musicGain)musicGain.gain.setTargetAtTime(on?.22:0,ac.currentTime,.3)},
    click(){if(!ok())return;tone(880,ac.currentTime,.06,"sine",.12)},
    draw(speed){if(!ok())return;const t=ac.currentTime;if(t-lastDraw<.045)return;lastDraw=t;noise(t,.06,.05+Math.min(.08,speed*.004),"bandpass",1800+Math.min(2500,speed*60),2.5);},
    bump(v){if(!ok())return;const t=ac.currentTime;if(t-lastBump<.06)return;lastBump=t;const k=Math.min(1,v/120);
      tone(180+k*120,t,.08,"triangle",.1+k*.25,null,90);noise(t,.04,.06+k*.12,"lowpass",900);if(k>.4)vib(12);},
    star(i){if(!ok())return;const t=ac.currentTime;tone(N(84+i*3),t,.35,"triangle",.2);tone(N(91+i*3),t+.06,.4,"sine",.12);vib(20);},
    boing(){if(!ok())return;const t=ac.currentTime;tone(220,t,.35,"sine",.35,null,660);tone(110,t,.2,"triangle",.15,null,220);vib(30);},
    portal(){if(!ok())return;const t=ac.currentTime;tone(300,t,.4,"sine",.18,null,1400);noise(t,.3,.1,"bandpass",2000,1);},
    start(){if(!ok())return;const t=ac.currentTime;[67,72,76].forEach((n,i)=>tone(N(n),t+i*.06,.2,"triangle",.14));},
    win(){if(!ok())return;const t=ac.currentTime;[72,76,79,84,88,91,96].forEach((n,i)=>tone(N(n),t+i*.08,.5,"triangle",.17));vib([30,40,30]);},
    fail(){if(!ok())return;const t=ac.currentTime;tone(N(67),t,.25,"sawtooth",.06,null,N(55));tone(N(60),t+.22,.45,"sawtooth",.06,null,N(48));vib(120);},
    zap(){if(!ok())return;const t=ac.currentTime;noise(t,.3,.4,"highpass",1500);tone(90,t,.3,"square",.12,null,40);vib(150);},
    no(){if(!ok())return;tone(200,ac.currentTime,.12,"sawtooth",.06,null,140)}
  };
})();
document.addEventListener("visibilitychange",()=>{document.hidden?Sound.suspend():Sound.resume();});

/* ================= Физика ================= */
const WW=100,WH=160,BR=3.2,GRAV=150,MAXV=230,DT=1/240;
function segDist(px,py,s){const dx=s.x2-s.x1,dy=s.y2-s.y1,l2=dx*dx+dy*dy||1e-9;let t=((px-s.x1)*dx+(py-s.y1)*dy)/l2;
  t=t<0?0:t>1?1:t;return[px-(s.x1+dx*t),py-(s.y1+dy*t)];}
function sawPos(s,t){const [x1,y1,x2,y2,r,spd]=s,len=Math.hypot(x2-x1,y2-y1)||1;let k=(t*spd/len)%2;k=k<1?k:2-k;
  k=k*k*(3-2*k);return[x1+(x2-x1)*k,y1+(y2-y1)*k];}
function makeWorld(lv,strokes){
  const w={segs:[],x:lv.ball[0],y:lv.ball[1],vx:0,vy:0,t:0,still:0,cool:0,inCup:0,status:"run",got:[],events:[],rot:0,lv,used:{tramp:0,portal:0,fan:0}};
  const add=(x1,y1,x2,y2,type)=>w.segs.push({x1,y1,x2,y2,type,h:type==="ink"?.9:type==="frame"?.6:1.2});
  add(0,-80,0,WH+30,"frame");add(WW,-80,WW,WH+30,"frame");
  (lv.walls||[]).forEach(s=>add(s[0],s[1],s[2],s[3],"wall"));
  (lv.boxes||[]).forEach(([x,y,bw,bh])=>{add(x,y,x+bw,y,"box");add(x+bw,y,x+bw,y+bh,"box");add(x+bw,y+bh,x,y+bh,"box");add(x,y+bh,x,y,"box");});
  (lv.tramp||[]).forEach(s=>add(s[0],s[1],s[2],s[3],"tramp"));
  if(lv.cup){const [cx,by]=lv.cup;add(cx-9,by-15,cx-9,by,"cup");add(cx-9,by,cx+9,by,"cup");add(cx+9,by,cx+9,by-15,"cup");}
  strokes.forEach(st=>{for(let i=1;i<st.length;i++)add(st[i-1][0],st[i-1][1],st[i][0],st[i][1],"ink");});
  (lv.stars||[]).forEach(()=>w.got.push(false));
  return w;
}
function stepWorld(w){
  if(w.status!=="run")return;
  const lv=w.lv;w.t+=DT;w.vy+=GRAV*DT;
  for(const f of (lv.fans||[])){if(w.x>f[0]&&w.x<f[0]+f[2]&&w.y>f[1]&&w.y<f[1]+f[3]){w.vy-=420*DT;w.used.fan+=DT;}}
  const sp=Math.hypot(w.vx,w.vy);if(sp>MAXV){w.vx*=MAXV/sp;w.vy*=MAXV/sp;}
  w.x+=w.vx*DT;w.y+=w.vy*DT;w.contact=false;
  for(let it=0;it<2;it++)for(const s of w.segs){
    const [dx,dy]=segDist(w.x,w.y,s),d=Math.hypot(dx,dy),rad=BR+s.h;
    if(d>=rad||d<1e-6)continue;
    const nx=dx/d,ny=dy/d;w.x+=nx*(rad-d);w.y+=ny*(rad-d);
    const vn=w.vx*nx+w.vy*ny;
    if(vn<0){
      if(s.type==="tramp"){const out=Math.max(-vn,100);w.vx+=nx*(out-vn);w.vy+=ny*(out-vn);w.events.push(["boing",w.x,w.y]);w.used.tramp++;}
      else{const e=vn<-28?.3:0;w.vx-=(1+e)*vn*nx;w.vy-=(1+e)*vn*ny;if(vn<-28)w.events.push(["bump",-vn]);
        const tx=-ny,ty=nx,vt=w.vx*tx+w.vy*ty;w.vx-=tx*vt*.0025;w.vy-=ty*vt*.0025;}
    }
    w.contact=true;

let last=0;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000||0);last=t;now=t;
  if(screen==="game"&&lv){
    drawBg(chapOf(li));drawLevel(lv,chapOf(li),t);
    if(showHint&&lv.sol)lv.sol.forEach(st=>{ctx.save();ctx.setLineDash([sc*2,sc*2]);ctx.lineDashOffset=-t*.03;ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=sc*1.4;ctx.lineCap="round";strokePath(st);ctx.stroke();ctx.restore();});

    if(phase==="run"&&world){
      acc+=dt;let n=0;while(acc>=DT&&n<16){stepWorld(world);acc-=DT;n++;}
      for(const e of world.events){
        if(e[0]==="bump")Sound.bump(e[1]);
        else if(e[0]==="boing"){Sound.boing();burst(X(e[1]),Y(e[2]),["#ff4f9a","#ffb3d6","#fff"],10);}
        else if(e[0]==="star"){Sound.star(world.got.filter(Boolean).length-1);burst(X(e[2]),Y(e[3]),["#ffc61a","#fff3a6","#ff9d3d"],22,1.4);updateHud();}
        else if(e[0]==="portal"){Sound.portal();burst(X(e[1]),Y(e[2]),["#4dc3ff","#fff"],12);burst(X(e[3]),Y(e[4]),["#ff9d3d","#fff"],12);trail.length=0;}
      }
      world.events.length=0;
      trail.push([world.x,world.y]);if(trail.length>22)trail.shift();
      trail.forEach((p,i)=>{ctx.fillStyle="rgba(255,255,255,"+(i/trail.length*.35)+")";ctx.beginPath();ctx.arc(X(p[0]),Y(p[1]),sc*BR*(i/trail.length)*.9,0,7);ctx.fill();});
      if(world.status!=="run"&&!ended)finish(world.status);
    }
    const bx=world?world.x:lv.ball[0],by=world?world.y:lv.ball[1];
    if(!(world&&(world.status==="spike"||world.status==="saw")&&ended))
      drawBall(X(bx),Y(by),sc*BR,world?world.rot:Math.sin(t*.002)*.2,skin,world?world.vx/80:0,world?world.vy/80:.3);

  Sound.unlock();if(screen!=="game"||phase!=="draw"||ended)return;

  if(inkUsed>=inkMax){toast("Чернила закончились — сотри лишнее");Sound.no();return;}
  if(inNoDraw(p)){toast("Здесь рисовать нельзя");Sound.no();return;}

      let h="<h2>Отлично!</h2><div class='bst'>"+[0,1,2].map(i=>"<span class='"+(i<st?"on":"")+"'>★</span>").join("")+"</div>";
      h+="<p>Уровень "+(li+1)+" пройден · чернил осталось "+save+"%</p>";
      if(got<3)h+="<p style='font-size:14px'>Собери все звёзды на пути, чтобы получить ★★★</p>";
      if(sk>=0)h+="<p style='color:#d1691c;font-weight:900'>🎁 Новый шарик: «"+SKINS[sk].n+"»!</p>";
      h+=(li<LEVELS.length-1?"<button class='btn g' id='eNext'>Дальше ›</button>":"<p><b>Ты прошёл все уровни! 🏆</b></p>")+
        "<button class='btn gr' id='eRetry'>Переиграть</button><button class='btn gr' id='eMap'>К уровням</button>";
      $("endCard").innerHTML=h;$("ovEnd").classList.add("on");
      $("endCard").querySelectorAll(".bst span").forEach((s,i)=>setTimeout(()=>{s.classList.add("show");if(i<st)Sound.star(i);},250+i*260));
      const nx=$("eNext");if(nx)nx.onclick=async()=>{closeEnd();if((li+1)%3===0)await Ads.interstitial();startLevel(li+1);};
      $("eRetry").onclick=()=>{closeEnd();startLevel(li);};$("eMap").onclick=()=>{closeEnd();goLevels();};
    },1100);
  }else{
    fails++;if(status==="spike"||status==="saw"){Sound.zap();burst(X(world.x),Y(world.y),["#fff","#ff6b6b","#ffd23e"],26,1.5);}else Sound.fail();
    setTimeout(()=>{
      const [t1,t2]=REASONS[status];
      let h="<h2>"+t1+"</h2><p>"+t2+". Попробуй ещё раз!</p>"+
        "<button class='btn g' id='eAgain'>↺ Заново</button>";
      if(!hinted[li]&&fails>=2)h+="<button class='btn y' id='eHint'>💡 Показать решение ▶</button>";
      h+="<button class='btn gr' id='eEdit'>✏️ Поправить линии</button>";
      $("endCard").innerHTML=h;$("ovEnd").classList.add("on");
      $("eAgain").onclick=async()=>{closeEnd();if(fails%4===0)await Ads.interstitial();resetRun();strokes=[];inkUsed=0;updateHud();};
      $("eEdit").onclick=()=>{closeEnd();resetRun();};
      const eh=$("eHint");if(eh)eh.onclick=async()=>{if(await getHint()){closeEnd();resetRun();}};
    },status==="out"?500:800);
  }
}
function closeEnd(){$("ovEnd").classList.remove("on");}
function resetRun(){ended=false;phase="draw";world=null;trail.length=0;setPlayBtn();updateHud();}
async function getHint(){
  if(hinted[li]){showHint=!showHint;return true;}
  const ok=await Ads.rewarded();if(!ok){toast("Реклама сейчас недоступна");return false;}
  hinted[li]=1;Store.set("hinted",hinted);showHint=true;updateHud();toast("Повтори пунктирную линию!");return true;
}

/* ================= Экраны ================= */
function showScreen(id){document.querySelectorAll(".scr").forEach(s=>s.classList.toggle("on",s.id===id));
  if(id){$("hud").classList.remove("on");$("tools").classList.remove("on");}}
function goMenu(){screen="menu";lv=null;world=null;showScreen("scrMenu");$("goSub").textContent="Уровень "+(unlocked()+1)+" · ★ "+totalStars();startDemo();
  document.querySelector("meta[name=theme-color]").content=CHAPTERS[0].bg[0];}
function goLevels(){screen="menu";lv=null;world=null;demo=null;showScreen("scrLevels");buildLevels();}
function buildLevels(){
  $("lvStars").textContent="★ "+totalStars()+" / "+LEVELS.length*3;const u=unlocked();
  $("chaps").innerHTML=CHAPTERS.map((c,k)=>{const end=k<CHAPTERS.length-1?CHAPTERS[k+1].from:LEVELS.length;let h="";
    for(let i=c.from;i<end;i++){const st=stars[i]||0,cls=i===u&&!st?"cur":i>u?"lock":"";
      h+="<button class='lv "+cls+"' data-i='"+i+"'>"+(i>u?"🔒":(i+1))+(i<=u?"<i>"+"★".repeat(st)+"☆".repeat(3-st)+"</i>":"")+"</button>";}
    return "<div class='chap' style='background:"+c.col+"'><h3>"+(k+1)+". "+c.name+"</h3><div class='lvls'>"+h+"</div></div>";}).join("");
  $("chaps").querySelectorAll(".lv").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i>u){Sound.no();return;}Sound.click();startLevel(i);});
  const c=$("chaps").querySelector(".cur");if(c)setTimeout(()=>c.scrollIntoView({block:"center"}),50);
}
function buildSkins(){
  const ts=totalStars();$("skStars").textContent="★ "+ts;
  $("skGrid").innerHTML=SKINS.map((s,i)=>{const own=skinsOwned.includes(i)||ts>=s.need;
    return "<div class='sk "+(i===skin?"sel":"")+"' data-i='"+i+"'><canvas width='168' height='168'></canvas>"+s.n+"<small>"+(i===skin?"✓ Выбран":own?"Нажми, чтобы выбрать":"★ "+s.need+" или ▶ реклама")+"</small></div>";}).join("");
  $("skGrid").querySelectorAll(".sk").forEach(el=>{const i=+el.dataset.i,c=el.querySelector("canvas"),real=ctx;ctx=c.getContext("2d");
    try{drawBall(84,80,58,0,i,.4,.2);}finally{ctx=real;}
    el.onclick=async()=>{const own=skinsOwned.includes(i)||totalStars()>=SKINS[i].need;
      if(!own){const ok=await Ads.rewarded();if(!ok){toast("Реклама сейчас недоступна");return;}skinsOwned.push(i);Store.set("skinsOwned",skinsOwned);toast("Шарик «"+SKINS[i].n+"» открыт!");}
      skin=i;Store.set("skin",skin);Sound.star(1);buildSkins();};});
}
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1900);}
function syncToggles(){document.querySelectorAll(".tg").forEach(el=>el.querySelector(".sw").classList.toggle("on",!!settings[el.dataset.k]));}
document.querySelectorAll(".tg").forEach(el=>el.onclick=()=>{const k=el.dataset.k;settings[k]=!settings[k];Store.set("settings",settings);syncToggles();if(k==="music")Sound.setMusic(settings.music);});

$("bGo").onclick=()=>{Sound.unlock();Sound.click();startLevel(unlocked());};
$("bLevels").onclick=()=>{Sound.unlock();Sound.click();goLevels();};
$("bSkins").onclick=()=>{Sound.unlock();Sound.click();screen="menu";demo=null;showScreen("scrSkins");buildSkins();};
$("bSet").onclick=()=>{Sound.unlock();Sound.click();syncToggles();$("ovSet").classList.add("on");};
$("bSetOk").onclick=()=>{Sound.click();$("ovSet").classList.remove("on");};
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{Sound.click();goMenu();layout();});
$("bBack").onclick=()=>{Sound.click();closeEnd();goLevels();};
$("bPlay").onclick=play;
$("bUndo").onclick=()=>{if(phase!=="draw"||ended)return;const s=strokes.pop();if(s){inkUsed=Math.max(0,inkUsed-strokeLen(s));Sound.click();updateHud();}};
$("bClear").onclick=()=>{if(phase!=="draw"||ended)return;strokes=[];inkUsed=0;Sound.click();updateHud();};
$("bHint").onclick=async()=>{Sound.unlock();await getHint();};
$("bSkip").onclick=async()=>{Sound.unlock();if(li>=LEVELS.length-1){toast("Это последний уровень!");return;}
  const ok=await Ads.rewarded();if(!ok){toast("Реклама сейчас недоступна");return;}
  if(!stars[li]){stars[li]=1;Store.set("stars",stars);}closeEnd();startLevel(li+1);};

/* ================= Запуск ================= */
layout();Ads.init();goMenu();requestAnimationFrame(frame);
window.__appPause=function(){Sound.suspend();};window.__appResume=function(){Sound.resume();};
window.__game={LEVELS,simulate,makeWorld,stepWorld,strokeLen,startLevel,goMenu,goLevels,play,
  get world(){return world},get phase(){return phase},get strokes(){return strokes},set strokes(v){strokes=v;},
  get stars(){return stars},get li(){return li},setSkin(i){skin=i;},layout};
</script>
</body>
</html>
